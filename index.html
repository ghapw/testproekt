сь.",points:1,tag:"Почти вовремя"},{id:"q1_2",label:"После победы уходить жалко, после проигрыша — обидно. В итоге очнулся в 02:40.",points:2,tag:"Засиделся"},{id:"q1_3",label:"В 04:50 за окном уже поют птицы, а я ищу в интернете «как выспаться за 40 минут».",points:3,tag:"До самого утра"}]},{id:2,category:"emotions",categoryLabel:"Настроение и нервы",contextBadge:"Пропал интернет",question:"Домашний интернет вдруг отключился в самый важный момент игры. Как ты отреагируешь?",subtitle:"Представь, что интернета не будет минимум пару часов.",options:[{id:"q2_0",label:"Спокойно пойду налью чай, посмотрю фильм или займусь своими делами.",points:0,tag:"Спокойствие"},{id:"q2_1",label:"Немного расстроюсь, проверю интернет и найду другое занятие на вечер.",points:1,tag:"Нормально"},{id:"q2_2",label:"Тут же раздаю интернет с телефона и нервничаю из-за каждой секунды.",points:2,tag:"Лишь бы доиграть"},{id:"q2_3",label:"Сильно разозлюсь на всю квартиру, начну звонить в поддержку и испорчу себе весь вечер.",points:3,tag:"Сильная злость"}]},{id:3,category:"sleep",categoryLabel:"Сон и режим",contextBadge:"Недосып по утрам",question:"Как часто ты не высыпаешься из-за игр, хотя утром надо на учёбу, работу или по делам?",subtitle:"Честно вспомни последние две-три недели.",options:[{id:"q3_0",label:"Почти никогда — хороший сон для меня важнее любых рекордов и наград в игре.",points:0,tag:"Крепкий сон"},{id:"q3_1",label:"Редко — раз в пару недель, обычно на выходных или когда вышла новая игра.",points:1,tag:"Иногда"},{id:"q3_2",label:"Два-три раза в неделю потом хожу сонный весь день и пью много кофе.",points:2,tag:"Частый недосып"},{id:"q3_3",label:"Постоянно: ночью сижу в игре, а днём еле держу глаза открытыми.",points:3,tag:"День с ночью перепутан"}]},{id:4,category:"social",categoryLabel:"Реальная жизнь",contextBadge:"Зовут друзья",question:"Друзья зовут погулять или посидеть в кафе, а в игре как раз раздают редкие подарки. Что выберешь?",subtitle:"И прогулка, и раздача подарков идут в одно и то же время.",options:[{id:"q4_0",label:"Конечно пойду с друзьями — игра никуда не денется, встретиться вживую важнее.",points:0,tag:"Друзья важнее"},{id:"q4_1",label:"Пойду гулять, а в игру зайду ненадолго вечером, если захочется.",points:1,tag:"Всё успею"},{id:"q4_2",label:"Буду долго сомневаться или постараюсь уйти домой пораньше, чтобы поиграть.",points:2,tag:"Тянет к экрану"},{id:"q4_3",label:"Придумаю отговорку про «срочные дела» и останусь дома забирать призы в игре.",points:3,tag:"Останусь дома"}]},{id:5,category:"sleep",categoryLabel:"Еда и порядок",contextBadge:"Кухня подождёт",question:"Как ты ешь и что творится у тебя на столе, когда ты долго играешь?",subtitle:"Посмотри на свой стол прямо сейчас — по нему сразу всё понятно.",options:[{id:"q5_0",label:"Выхожу из-за компьютера, иду на кухню и нормально ем за столом.",points:0,tag:"Чистота"},{id:"q5_1",label:"Иногда беру к экрану чай с бутербродом, но тарелки и кружки сразу уношу.",points:1,tag:"Аккуратно"},{id:"q5_2",label:"Быстро перекусываю одной рукой прямо над клавиатурой, пока грузится уровень.",points:2,tag:"Еда на ходу"},{id:"q5_3",label:"Забываю поесть до вечера, а на столе уже скопилось четыре грязные кружки.",points:3,tag:"Гора кружек"}]},{id:6,category:"control",categoryLabel:"Мысли днём",contextBadge:"О чём голова думает",question:"О чём ты думаешь днём, когда едешь куда-то, сидишь на уроках, на работе или в очереди?",subtitle:"Как часто ты вспоминаешь про игры в течение дня?",options:[{id:"q6_0",label:"О своих обычных делах и планах — про игры вспоминаю только дома вечером.",points:0,tag:"Свободная голова"},{id:"q6_1",label:"Иногда могу глянуть новости про игры в телефоне, если совсем нечего делать.",points:1,tag:"Просто интерес"},{id:"q6_2",label:"Часто обдумываю, как пройти сложный момент и какие новые вещи появились в игре.",points:2,tag:"Мысли об игре"},{id:"q6_3",label:"Считаю часы, когда уже попаду домой к компьютеру — всё остальное кажется ужасно скучным.",points:3,tag:"Жду только вечера"}]},{id:7,category:"emotions",categoryLabel:"Настроение и нервы",contextBadge:"Полоса неудач",question:"Не везёт в игре: пять проигрышей подряд или обидная неудача в самом конце уровня. Что с настроением?",subtitle:"Мешают ли неудачи в игре нормально общаться с домашними?",options:[{id:"q7_0",label:"Посмеюсь, выключу игру и займусь чем-то другим — это ведь просто отдых.",points:0,tag:"Лёгкое отношение"},{id:"q7_1",label:"Позлюсь минут пять, выдохну и спокойно пойду заниматься своими делами.",points:1,tag:"Быстро остываю"},{id:"q7_2",label:"Хожу расстроенный весь вечер и не ложусь спать, пока не отыграюсь.",points:2,tag:"Не могу отпустить"},{id:"q7_3",label:"Бью кулаком по столу, кричу и могу нагрубить близким вообще ни за что.",points:3,tag:"Срываюсь на всех"}]},{id:8,category:"control",categoryLabel:"Деньги и покупки",contextBadge:"Специальные вещи и скидки",question:"Красивые костюмы, специальные вещи, платные сундуки с призами или скидки на игры. Тратишь ли ты на это деньги?",subtitle:"Как ты относишься к покупкам внутри игры и покупкам игр «на потом»?",options:[{id:"q8_0",label:"Покупаю только сами игры, в которые точно буду играть, а на вещи внутри игры деньги не трачу.",points:0,tag:"Экономно"},{id:"q8_1",label:"Иногда беру хорошую игру по скидке или недорогую вещь из свободных денег.",points:1,tag:"В меру"},{id:"q8_2",label:"Уже накупил(а) кучу игр, которые даже не запускал(а), и часто беру специальные вещи для героя.",points:2,tag:"Люблю покупать"},{id:"q8_3",label:"Трачу деньги сгоряча ради редких вещей и призов, а потом жалею, что столько ушло.",points:3,tag:"Лишние траты"}]},{id:9,category:"social",categoryLabel:"Самоконтроль",contextBadge:"Несколько дней без игр",question:"Пробовал(а) ли ты сам(а) не играть хотя бы 3–4 дня подряд, без чужих запретов?",subtitle:"Что происходит, когда ты несколько дней вообще не включаешь игры?",options:[{id:"q9_0",label:"Легко: могу не включать игры целыми неделями и даже не вспоминать о них.",points:0,tag:"Полная свобода"},{id:"q9_1",label:"Спокойно обхожусь без игр в поездках или когда есть другие интересные дела.",points:1,tag:"Легко отвлекаюсь"},{id:"q9_2",label:"На второй день вечером становится скучно и пусто — руки сами тянутся включить игру.",points:2,tag:"Сильно тянет"},{id:"q9_3",label:"Уже сто раз обещал(а) себе сделать перерыв или играть меньше — хватало до первого вечера.",points:3,tag:"Трудно остановиться"}]},{id:10,category:"sleep",categoryLabel:"Самочувствие",contextBadge:"Усталость за столом",question:"Затекла шея, устали глаза и разболелась спина после долгих часов за экраном — что ты делаешь?",subtitle:"Последний вопрос перед подсчётом твоего результата.",options:[{id:"q10_0",label:"Я и не сижу так долго подряд: делаю перерывы и вовремя выключаю игру.",points:0,tag:"Берегу себя"},{id:"q10_1",label:"Как только устал — сразу встаю пройтись, размяться и дать глазам отдохнуть.",points:1,tag:"Вовремя встаю"},{id:"q10_2",label:"Сажусь криво, подпираю голову рукой и продолжаю играть ещё пару часов.",points:2,tag:"Сижу скрючившись"},{id:"q10_3",label:"Терплю до последнего, пока при подъёме со стула не начнёт хрустеть спина.",points:3,tag:"Сижу до упора"}]}],Ca=[{id:"none",levelNumber:1,minScore:0,maxScore:7,levelBadge:"Уровень 1 из 4 • Зависимости нет",dependencyTitle:"Зависимости нет (Полный порядок)",gamerRank:"Человек со здоровым режимом",accentHex:"#10B981",summary:"Игры для тебя — просто приятный отдых в свободное время, а не вся жизнь. Ты легко выключаешь игру в любой момент, хорошо спишь и всегда выбираешь живое общение, прогулки и свои дела вместо сидения у экрана.",totemItem:{name:"Значок Спокойствия",stats:"Крепкий сон • Никакая игра не заставит тебя сидеть до утра"},jokes:["Ты тот самый редкий человек, который после слов «сейчас доиграю и спать» правда идёт спать. Друзья до сих пор не верят, что так бывает.","Твой компьютер так мало напрягается, что у него внутри даже пыль не успевает нагреться.","Когда знакомые рассказывают, как просидели за игрой до пяти утра, ты искренне удивляешься, как у них не слиплись глаза ещё в полночь."],tips:[{title:"Держи такой же режим и дальше",text:"Продолжай играть только тогда, когда правда хочется отдохнуть вечером или в выходной, а не каждый день по расписанию."},{title:"Выбирай игры с понятным концом",text:"Игры с интересной историей или весёлые игры в компании друзей дарят хорошее настроение и не затягивают на месяцы."},{title:"Береги глаза вечером",text:"Не играй в полной темноте — включай обычную настольную лампу, чтобы глаза меньше уставали."}],doList:["Дальше ставить сон, прогулки и встречи с друзьями выше любых игр","Играть ради хорошего настроения, а не потому что «надо забрать подарок»","Раз в час вставать из-за стола на пять минут, чтобы размять шею и плечи","Выбирать весёлые игры с друзьями вместо злых споров с незнакомцами в сети","Сохранять эту хорошую привычку, даже когда выходит громкая новинка"],dontList:["Не скачивать телефонные игры, которые просят заходить каждые два часа","Не начинать долгую игру за 20 минут до сна","Не накупать кучу игр по скидкам «про запас», если сейчас не тянет играть","Не ругать себя за час отдыха вечером — при твоём подходе это только на пользу","Не мериться с другими, кто сколько часов наиграл"]},{id:"mild",levelNumber:2,minScore:8,maxScore:15,levelBadge:"Уровень 2 из 4 • Лёгкое увлечение",dependencyTitle:"Лёгкая тяга к играм (Всё в норме, но бывает засиживаешься)",gamerRank:"Любитель поиграть подольше",accentHex:"#F59E0B",summary:"В целом ты хорошо следишь за своим временем, но иногда интересная игра или желание отыграться незаметно воруют у тебя пару часов сна. Серьёзной проблемы нет, но знакомая уловка «ну ещё чуть-чуть — и выключаю» с тобой иногда срабатывает.",totemItem:{name:"Кружка Остывшего Чая",stats:"Тёплый вечер у экрана • Иногда ложишься позже, чем обещал себе"},jokes:["Твой любимый самообман: «Зайду буквально на пятнадцать минут посмотреть, что там нового» — а потом смотришь на часы и видишь половину второго ночи.","У тебя наверняка куплено штук пять отличных игр «на потом», но вечером ты всё равно включаешь одну и ту же старую любимую игру.","Ты с удовольствием гуляешь с друзьями, но иногда в магазине мысленно прикидываешь, сколько игр по скидке вышло бы на эти деньги."],tips:[{title:"Ставь напоминание за 45 минут до сна",text:"Пусть в 23:15 звонит тихий будильник — это знак не начинать заново, а спокойно доиграть и выключать компьютер."},{title:"Правило двух проигрышей подряд",text:"Если два раза подряд не повезло — лучше выключи игру. Когда ты устал и пытаешься отыграться, обычно становится только обиднее."},{title:"Выключи оповещения от игр на телефоне",text:"Сообщения про подарки и скидки специально присылают днём, чтобы лишний раз заманить тебя обратно в игру."}],doList:["Заранее решать ещё до запуска игры, во сколько ты сегодня встанешь из-за стола","Выключать компьютер хотя бы за 40 минут до сна, чтобы быстрее уснуть","Есть на кухне за обычным столом, а не крошить еду на клавиатуру","Чередовать вечера за компьютером с прогулками, спортом и живыми встречами","Удалять игры, в которые ты заходишь без радости, а просто за ежедневным подарком"],dontList:["Не включать игру «на пять минуточек» прямо перед выходом из дома или перед сном","Не заставлять себя играть до победного конца, если глаза уже закрываются","Не смотреть игровые ролики в телефоне, когда уже лёг в кровать","Не утешать себя мыслью «не посплю в будни — отосплюсь в воскресенье»","Не покупать специальные пропуска и платные вещи, ради которых надо заходить в игру каждый день как на работу"]},{id:"moderate",levelNumber:3,minScore:16,maxScore:23,levelBadge:"Уровень 3 из 4 • Заметная зависимость",dependencyTitle:"Заметная зависимость (Пора наладить режим)",gamerRank:"Ночной житель у монитора",accentHex:"#F97316",summary:"Игры начали заметно мешать сну, учёбе или работе и обычным делам. Из-за ярких игр повседневная жизнь начинает казаться скучной, а неудачи на экране легко портят настроение на весь вечер. Самое время немного притормозить и вернуть себе бодрость.",totemItem:{name:"Значок Красных Глаз",stats:"Знаешь все секреты в игре • Тяжело вставать по утрам • Спина просит разминки"},jokes:["За компьютером ты сидишь согнувшись колесом, но стоит кому-то открыть дверь в комнату — за секунду выпрямляешься как по линейке.","Ты наизусть помнишь все углы и тайники на игровой карте, но иногда забываешь, какой сегодня день недели.","Фразу «да я вообще не злюсь, я спокоен!» ты обычно говоришь так громко, что вздрагивает даже кот в соседней комнате."],tips:[{title:"Никаких игр с утра и перед самым сном",text:"Не садись за игры в первые два часа после подъёма и за час до сна — так голова будет меньше уставать, а засыпать станет намного проще."},{title:"Удали самую затягивающую игру на две недели",text:"Сделай перерыв на 14 дней от той игры, которая съедает больше всего времени. Ты удивишься, сколько свободных вечеров и сил сразу появится."},{title:"Снимай усталость движением, а не за экраном",text:"Полчаса прогулки быстрым шагом, велосипеда или зарядки разгружают голову после тяжёлого дня гораздо лучше, чем нервная игра."},{title:"Убери значки игр с самого видного места",text:"Сделай так, чтобы программы с играми не включались сами при запуске компьютера — тогда ты перестанешь заходить туда по привычке."}],doList:["Убрать значки игр с рабочего стола и отключить их сам запуск при включении компьютера","Ставить будильник на конец игры и вставать сразу, как только он прозвонит","Звать друзей гулять именно вечером, когда сильнее всего тянет сесть за компьютер","Делать 2–3 дня в неделю полностью свободными от любых игр","Пить простую воду или обычный чай вместо энергетиков и кофе по ночам"],dontList:["Не сидеть за играми по ночам — из-за недосыпа ты быстрее злишься и ещё сильнее тянешься к экрану","Не садиться играть голодным, расстроенным или очень уставшим","Не отказываться от встреч с живыми людьми ради призов и заданий в игре","Не привязывать банковскую карту к игре, чтобы не тратить деньги на специальные вещи в одно нажатие","Не срывать злость на родных, если в игре что-то не получилось"]},{id:"high",levelNumber:4,minScore:24,maxScore:30,levelBadge:"Уровень 4 из 4 • Сильная зависимость",dependencyTitle:"Сильная зависимость (Пора сделать перерыв)",gamerRank:"Пленник ночного экрана",accentHex:"#FF3B5C",summary:"Сейчас игры забрали себе почти всё твоё время и силы: страдают сон, здоровье, настроение и обычные дела. Игры уже не столько радуют, сколько помогают спрятаться от усталости и забот. Пора сделать паузу и заняться собой в настоящей жизни.",totemItem:{name:"Ключ от Запертой Комнаты",stats:"Бессонные ночи у экрана • Обычная прогулка днём уже кажется большим событием"},jokes:["Когда ты всё-таки выходишь днём на улицу в магазин, вокруг всё очень красивое и чёткое, только очередь на кассе почему-то нельзя перемотать вперёд.","На твоём столе за неделю собирается столько кружек и тарелок, что мама или близкие заходят в комнату как на раскопки древнего города.","Утреннее пение птиц за окном для тебя — не знак вставать, а намёк, что пора бы наконец сохраниться и лечь поспать."],tips:[{title:"Сделай полный перерыв от игр на 7 дней",text:"Когда вовремя остановиться уже не выходит, намного проще вообще не включать игры целую неделю, чем каждый вечер зря обещать себе «поиграю только часок»."},{title:"Заранее придумай, чем займёшь вечера",text:"Если удалить игру и просто скучать на диване, ты быстро сорвёшься. Заранее запланируй на вечер прогулку, кино, спорт, готовку вкусного ужина или встречу."},{title:"Ставь себе маленькие цели в обычной жизни",text:"Начни отмечать простые успехи каждый день: лечь спать вовремя, пройти 8 тысяч шагов, разобрать стол, подтянуться на турнике или закрыть долг по учёбе."},{title:"Поговори по душам с близкими или психологом",text:"Часто человек уходит в игры с головой, когда сильно устал, тревожится или переживает трудности. Спокойный разговор и поддержка помогут разобраться с этим намного быстрее."}],doList:["Устроить честный
